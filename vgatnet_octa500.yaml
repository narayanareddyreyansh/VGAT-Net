experiment: vgatnet_octa500
seed: 0                 # repeat with 0, 1, 2 and average 

data:
  root: ./datasets/OCTA-500
  train_split: ./data/splits/octa500_train.txt
  val_split:   ./data/splits/octa500_val.txt
  test_split:  ./data/splits/octa500_test.txt
  image_size: 512
  clip_limit: 2.0
  num_workers: 8

model:
  name: vgatnet
  in_channels: 1
  base_channels: 64        # constant feature width C across the attention stack
  encoder_depth: 4         # downsampling stages -> bottleneck at H/16
  embed_dim: 512
  tca_depth: 6
  tca_heads: 8
  patch_size: 2
  vgfa_heads: 8

loss:
  lambda1: 1.0             # vessel task weight
  lambda2: 0.8             # FAZ task weight
  topo_iters: 10

optim:
  optimizer: adam
  lr: 1.0e-4
  weight_decay: 1.0e-5
  scheduler: cosine        # cosine annealing
  batch_size: 8
  epochs: 100
  early_stopping_patience: 15
  amp: true

eval:
  threshold: 0.5
  metrics: [DSC, IoU, SE, SP, HD95]

output_dir: ./runs/vgatnet_octa500
